name: Deploy test then production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: adminzrenie-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      BOOKING_MONITORING_ENABLED: 'false'
      DEPLOY_HOST: 147.45.184.229
      DEPLOY_USER: adminzrenie-deploy

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, gd, zip, redis
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Run application tests
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          vendor/bin/phpunit

      - name: Package release
        id: release
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          bash scripts/package-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/release.tar.gz"
          echo "digest=$(sha256sum "$RUNNER_TEMP/release.tar.gz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Configure pinned SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy-key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-known-hosts"
          cat > "$RUNNER_TEMP/deploy-ssh-config" <<CONFIG
          Host adminzrenie-deploy
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            BatchMode yes
            IdentitiesOnly yes
            IdentityFile "$RUNNER_TEMP/deploy-key"
            UserKnownHostsFile "$RUNNER_TEMP/deploy-known-hosts"
            GlobalKnownHostsFile /dev/null
            HostKeyAlgorithms ssh-ed25519
            StrictHostKeyChecking yes
            ConnectTimeout 10
            ServerAliveInterval 15
            ServerAliveCountMax 3
          CONFIG

      - name: Deploy test
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          ssh -F "$RUNNER_TEMP/deploy-ssh-config" adminzrenie-deploy \
            "test $GITHUB_SHA $DIGEST" < "$RUNNER_TEMP/release.tar.gz"

      - name: Verify public test site
        run: bash scripts/verify-release.sh test "$GITHUB_SHA"

      - name: Promote the verified release to production
        env:
          DIGEST: ${{ steps.release.outputs.digest }}
        run: |
          ssh -F "$RUNNER_TEMP/deploy-ssh-config" adminzrenie-deploy \
            "production $GITHUB_SHA $DIGEST"

      - name: Verify public production site
        run: bash scripts/verify-release.sh production "$GITHUB_SHA"

      - name: Remove SSH credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy-key" "$RUNNER_TEMP/deploy-known-hosts" "$RUNNER_TEMP/deploy-ssh-config"
